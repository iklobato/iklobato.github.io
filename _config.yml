title: Henrique Lobato
description: "Senior Python and AI engineer. I connect systems, ship AI to production and fix backends that do not scale. Consulting and freelance, remote."
author: Henrique Lobato
baseurl: ""
url: "https://iklobato.com"
# Every "book a call" link on the site points here. Swap this one line to move
# to another scheduling service.
booking_url: &booking_url https://cal.iklobato.com/iklobato/lets-talk
social:
  name: Henrique Lobato
  github: iklobato
  linkedin: iklobato
  links:
    - https://www.linkedin.com/in/iklobato/
    - https://github.com/iklobato
    - *booking_url

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# jekyll-seo-tag defaults
twitter:
  username: iklobato
  card: summary_large_image
logo: /assets/images/og-card.png
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/og-card.png

# Jekyll settings
permalink: pretty
encoding: UTF-8

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - backend_cv_enhanced.md
  - data_engineer_cv_enhanced.md
  - devops_cv_enhanced.md
  - unified_cv_template.md
  - index.html
  - index.md.backup
  - services-subpages-plan.md
  - specs
  - .specify
  - .cursor
  - .idea
  - Makefile
  - .DS_Store